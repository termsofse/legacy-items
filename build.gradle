plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.version
group = project.group

base {
	archivesName = project.archives_base_name
}

repositories {
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

// Verification harness: runs the mod's real DataFix against the real 26.1 classes.
tasks.register('compileProof', JavaCompile) {
	source = fileTree('tools') { include '**/*.java' }
	classpath = sourceSets.main.runtimeClasspath
	destinationDirectory = file('build/proof')
	options.release = 25
}

tasks.register('proof', JavaExec) {
	dependsOn tasks.named('classes'), tasks.named('compileProof')
	classpath = sourceSets.main.runtimeClasspath + files('build/proof')
	mainClass = 'Proof'
}
